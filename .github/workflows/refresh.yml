name: Refresh Model Standings

on:
  schedule:
    - cron: "0 7 * * 1"   # every Monday 07:00 UTC — edit to taste (min interval: hourly)
  workflow_dispatch: {}     # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild docs/index.html
        run: python3 refresh.py

      - name: Commit and push if changed
        run: |
          git config user.name "model-standings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet && echo "No changes." || git commit -m "Weekly refresh: $(date -u +%Y-%m-%d)"
          git push
